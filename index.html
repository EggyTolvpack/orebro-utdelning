function status(s){document.getElementById('status').textContent=s}
function meters(a,b){const r=Math.PI/180,x=(b[1]-a[1])*r*Math.cos((a[0]+b[0])/2*r)*6371000,y=(b[0]-a[0])*r*6371000;return Math.hypot(x,y)}

function update(){const shown=visibleRoads();let done=0;for(const r of ROADS){const yes=!!state.done[r.id],active=selected==='all'||r.areas.includes(selected);if(active&&yes)done++;layers[r.id].setStyle({color:yes?'#1cad59':'#d93030',weight:yes?7:6,opacity:active?.9:.2});}const pct=shown.length?Math.round(done/shown.length*100):0;document.getElementById('fill').style.width=pct+'%';document.getElementById('percent').textContent=pct+' %';document.getElementById('count').textContent=done+'/'+shown.length;const total=ROADS.filter(r=>state.done[r.id]).length;document.getElementById('area-info').textContent=selected==='all'?'Adolfsberg · Marieberg · Gamla Vintrosavägen':'Hela appen: '+total+'/'+ROADS.length+' gatbitar klara';}

function gps(pos){let p=[pos.coords.latitude,pos.coords.longitude],acc=pos.coords.accuracy||999;const now=Date.now();if(!positionMarker){positionMarker=L.circleMarker(p,{radius:8,color:'white',weight:3,fillColor:'#2678e7',fillOpacity:1}).addTo(map);accuracyCircle=L.circle(p,{radius:acc,weight:1,color:'#2678e7',fillOpacity:.06}).addTo(map)}else{positionMarker.setLatLng(p);accuracyCircle.setLatLng(p).setRadius(acc)}if(follow)map.panTo(p,{animate:false});if(acc>35){status('GPS-osäkerhet '+Math.round(acc)+' m – väntar på bättre signal.');return}if(prev&&meters(prev,p)>120){status('GPS-hopp upptäckt – ignoreras.');prev=p;return}prev=p;

if(document.getElementById('auto').checked){let changed=false;for(const r of ROADS){if(state.done[r.id]||(selected!=='all'&&!r.areas.includes(selected)))continue;let near=distToSeg(p,r.a,r.b);if(near.d>18)continue;let length=meters(r.a,r.b),num=Math.max(2,Math.ceil(length/12)+1),bits=state.samples[r.id]||{};for(let k=0;k<num;k++){let t=k/(num-1),sample=[r.a[0]+(r.b[0]-r.a[0])*t,r.a[1]+(r.b[1]-r.a[1])*t];if(meters(p,sample)<=18)bits[k]=1;}state.samples[r.id]=bits;if(Object.keys(bits).length/num>=.75){state.done[r.id]=true;state.history.push({id:r.id,before:false,at:now,source:'gps'});changed=true}}if(changed)update()}

document.getElementById('start').onclick=()=>{if(!navigator.geolocation){status('GPS stöds inte i den här webbläsaren.');return}if(!window.isSecureContext){status('GPS kräver HTTPS. Publicera sidan enligt instruktionen.');return}watch=navigator.geolocation.watchPosition(gps,error,{enableHighAccuracy:true,maximumAge:0,timeout:18000});document.getElementById('start').disabled=true;document.getElementById('stop').disabled=false;status('Väntar på GPS...')};
